<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise!</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="no-navbar locked">
  <main>
    <section class="snap-section">
      <div class="section-content">
        <h1 class="section-title pixel-text">Scroll Down...</h1>
        <div class="arrow-down" aria-hidden="true"></div>
      </div>
    </section>
    <section class="snap-section">
      <div class="section-content">
        <img class="surprise-image" src="../assets/images/troll.jpg" alt="Surprise">
      </div>
    </section>
    <section class="snap-section">
      <div class="section-content">
        <h1 class="section-title cyber-text">Teehee!</h1>
        <h1 class="section-title cyber-text">Dhruv!! Happy 21st birthday big man! </h1>
      </div>
    </section>
  </main>

  <div class="password-gate" role="dialog" aria-modal="true" aria-labelledby="password-gate-title">
    <div class="password-gate-card">
      <h1 id="password-gate-title" class="section-title pixel-text">Locked</h1>
      <p class="cyber-text">Hint: what's the word of the day?</p>
      <input id="password-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="password" />
      <p id="password-error" class="cyber-text password-error" aria-live="polite"></p>
    </div>
  </div>

  <script>
    (function () {
      const PASSWORD = 'paean';
      const body = document.body;
      const input = document.getElementById('password-input');
      const error = document.getElementById('password-error');

      function tryUnlock() {
        if (input.value.trim().toLowerCase() === PASSWORD) {
          body.classList.remove('locked');
          error.textContent = '';
        } else {
          error.textContent = 'Nope. Try again.';
          input.value = '';
        }
      }

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          tryUnlock();
        } else {
          error.textContent = '';
        }
      });

      // Focus once the gate paints.
      requestAnimationFrame(() => input.focus());
    })();
  </script>
</body>
</html>
